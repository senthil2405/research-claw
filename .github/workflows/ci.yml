name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the gate — the DB-backed unit tests and the
    # Playwright dev server connect here. No real LLM spend (CLAUDE_FORCE_MOCK).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_claw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_claw?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_claw?schema=public
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_ENCRYPTION_KEY: MIrtAMfkd4iN1G+2QLZkskbthFQoN9D2gRwqN2A8Ewc=
      CLAUDE_FORCE_MOCK: "true"
      STORAGE_DRIVER: local
      ALLOW_DEV_LOGIN: "true"
      NEXT_PUBLIC_ALLOW_DEV_LOGIN: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          # Add this in GitHub → Settings → Secrets → Actions.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

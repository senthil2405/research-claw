# fly.toml app configuration file generated for research-claw on 2026-07-02T11:45:07+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'research-claw'
# Mumbai (bom) is out of volume capacity; Singapore is the closest
# well-provisioned region to the Supabase project (ap-south-1).
primary_region = 'sin'

[build]

[deploy]
  release_command = 'node prisma/migrate-deploy.mjs'

[env]
  ALLOW_DEV_LOGIN = 'false'
  AUTH_URL = 'https://research-claw.fly.dev'
  CLAUDE_AUTH_DIR = '/data/claude-auth'
  CLAUDE_MODEL = 'claude-sonnet-4-6'
  NEXT_PUBLIC_ALLOW_DEV_LOGIN = 'false'
  NODE_ENV = 'production'
  STORAGE_DRIVER = 'r2'

[[mounts]]
  source = 'rc_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
